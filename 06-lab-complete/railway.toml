# ============================================================
# Railway — build bằng Dockerfile, kiểm tra /health trước khi chuyển traffic.
# PORT do Railway cấp, Dockerfile CMD đã đọc ${PORT:-8000}.
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên dashboard / `railway variables`,
# KHÔNG ghi trong file này.
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
