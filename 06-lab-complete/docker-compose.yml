# ============================================================
# Chạy agent + redis bằng một lệnh:  docker compose up --build
# Trước đó: cp .env.example .env  rồi đặt AGENT_API_KEY trong .env (file .env không commit)
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # không có .env vẫn chạy được (AGENT_API_KEY trống → /ask luôn 401)
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0   # "redis" là tên service bên dưới — DNS nội bộ của Compose
    depends_on:
      redis:
        condition: service_healthy     # chờ Redis trả PONG rồi mới bật agent
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # ghi xuống đĩa → restart không mất state
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
