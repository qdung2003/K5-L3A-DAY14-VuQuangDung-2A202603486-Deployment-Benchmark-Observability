# ============================================================
# Render Blueprint — phương án thay cho Railway.
# Khai báo 2 service: web (agent, build từ Dockerfile) + keyvalue (Redis-compatible).
# Secret không ghi thẳng giá trị: AGENT_API_KEY dùng generateValue, REDIS_URL lấy từ service Redis.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []          # chỉ cho kết nối nội bộ từ các service trên Render
    maxmemoryPolicy: noeviction
